name: Build adjoint-lift PDFs
on:
  push:
    branches: [main]
    paths:
      - 'adjoint-lift/*.tex'
      - '.github/workflows/build-adjoint-lift.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript and revision log
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            adjoint_lift_revisit.tex
            adjoint_lift_revisit_revision_log.tex
          working_directory: adjoint-lift
      - name: Commit generated PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adjoint-lift/adjoint_lift_revisit.pdf adjoint-lift/adjoint_lift_revisit_revision_log.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Build adjoint-lift revisit PDFs'
            git push
          fi
